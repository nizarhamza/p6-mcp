[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "p6mcp"
dynamic = ["version"]
description = "Local MCP server for Primavera P6 Professional standalone databases (not affiliated with Oracle)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.8,<3",
    "keyring>=25",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
settings = ["PySide6-Essentials>=6.7"]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-xdist>=3.6", "ruff>=0.6", "PySide6-Essentials>=6.7"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
p6mcp-server = "p6mcp.__main__:main"

[project.gui-scripts]
p6mcp-settings = "p6mcp.settings_app.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "p6mcp.__version__" }

[tool.setuptools.packages.find]
include = ["p6mcp*"]

[tool.setuptools.package-data]
p6mcp = ["locales/*.json", "data/core_skills/*.json", "remote/worker.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
# Inner loop (398 of 513 tests, 45 s instead of 110 s on 2026-11-27): pytest -q -m "not slow and not qt and not parity"
# CI and releases run everything on 4 workers (pytest -n 4, pytest-xdist). tests/conftest.py marks tests using the
# fixtures live or child_env (slow) and qtbot (qt) itself.
markers = [
    "slow: starts a real process or server (subprocess, uvicorn, child processes, node)",
    "qt: drives Qt widgets (PySide6, pytest-qt)",
    "parity: CPM engine against the synthetic P6 parity cases",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# The modules split from the single-file server (3.5.0) keep its long lines; every other rule applies to them.
"p6mcp/registry.py" = ["E501"]
"p6mcp/core/*.py" = ["E501"]
"p6mcp/tools/*.py" = ["E501"]
