[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "p6mcp"
dynamic = ["version"]
description = "Local MCP server for Primavera P6 Professional standalone databases (not affiliated with Oracle)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.8,<3",
    "keyring>=25",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
settings = ["PySide6-Essentials>=6.7"]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "PySide6-Essentials>=6.7"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
p6mcp-server = "p6mcp.__main__:main"

[project.gui-scripts]
p6mcp-settings = "p6mcp.settings_app.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "p6mcp.__version__" }

[tool.setuptools.packages.find]
include = ["p6mcp*"]

[tool.setuptools.package-data]
p6mcp = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["p6mcp/server.py"]  # legacy single-file module: linted once it is split

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
