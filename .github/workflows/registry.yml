name: MCP Registry

# Publishes this server to the official MCP Registry (registry.modelcontextprotocol.io) as
# io.github.nizarhamza/p6-mcp, with the release's MCP bundle (.mcpb) as its package.
# A tag vX.Y.Z runs release.yml, which builds and tests everything and creates a DRAFT release. Publishing that
# release after the manual checklist (docs/RELEASING.md) makes the .mcpb public and runs this workflow; the
# Registry entry then points at a file anyone can download. A manual run republishes an existing release.
# Authentication: GitHub OIDC (no secret): only workflows of a repository owned by nizarhamza can publish
# under io.github.nizarhamza/*.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true

permissions:
  contents: read
  id-token: write

env:
  MCP_PUBLISHER_VERSION: v1.8.6

jobs:
  publish:
    # pre-releases stay out of the Registry
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download the release's MCP bundle and check its SHA-256
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "p6mcp-*.mcpb" --pattern SHA256SUMS.txt
          cd dist
          sha256sum --check --ignore-missing --strict SHA256SUMS.txt
          test "$(ls p6mcp-*.mcpb | wc -l)" -eq 1

      - name: server.json for this release (version, bundle URL, SHA-256)
        run: |
          set -euo pipefail
          python packaging/server_json.py --mcpb "$(ls dist/p6mcp-*.mcpb)" \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --out server.json
          grep -q "/releases/download/$TAG/" server.json || { echo "bundle of $TAG expected"; exit 1; }
          cat server.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate
        run: ./mcp-publisher validate server.json

      - name: Log in with GitHub OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
